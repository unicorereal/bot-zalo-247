<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 375" role="img"><title>Hai khóa Zalo có vai trò khác nhau</title><rect width="820" height="375" rx="24" fill="#edf3fa"/><text x="36" y="44" font-family="sans-serif" font-size="23" font-weight="bold" fill="#102d4c">Hai khóa Zalo có vai trò khác nhau</text><rect x="36" y="70" width="748" height="68" rx="13" fill="white" stroke="#bccde1"/><circle cx="67" cy="104" r="18" fill="#176d69"/><text x="67" y="110" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">1</text><text x="104" y="98" font-family="sans-serif" font-size="19" font-weight="bold" fill="#102d4c">WEBHOOK_SECRET ↔ Secret Token</text><text x="104" y="121" font-family="sans-serif" font-size="16" fill="#4d617a">Cùng một giá trị để kiểm yêu cầu gửi từ Zalo</text><rect x="36" y="160" width="748" height="68" rx="13" fill="white" stroke="#bccde1"/><circle cx="67" cy="194" r="18" fill="#176d69"/><text x="67" y="200" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">2</text><text x="104" y="188" font-family="sans-serif" font-size="19" font-weight="bold" fill="#102d4c">ZALO_BOT_TOKEN ↔ Bot Token</text><text x="104" y="211" font-family="sans-serif" font-size="16" fill="#4d617a">Cho phép chương trình gọi API của đúng bot</text><rect x="36" y="250" width="748" height="68" rx="13" fill="white" stroke="#bccde1"/><circle cx="67" cy="284" r="18" fill="#176d69"/><text x="67" y="290" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">3</text><text x="104" y="278" font-family="sans-serif" font-size="19" font-weight="bold" fill="#102d4c">OPENAI_API_KEY</text><text x="104" y="301" font-family="sans-serif" font-size="16" fill="#4d617a">Thêm ở Bài 4; lưu trong mục Secret của Cloudflare</text><text x="36" y="359" font-family="sans-serif" font-size="14" fill="#4d617a">Sơ đồ minh họa • Không phải ảnh chụp giao diện thật</text></svg>