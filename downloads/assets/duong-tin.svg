<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 465" role="img"><title>Một tin nhắn đi qua đâu?</title><rect width="820" height="465" rx="24" fill="#edf3fa"/><text x="36" y="44" font-family="sans-serif" font-size="23" font-weight="bold" fill="#102d4c">Một tin nhắn đi qua đâu?</text><rect x="36" y="70" width="748" height="68" rx="13" fill="white" stroke="#bccde1"/><circle cx="67" cy="104" r="18" fill="#176d69"/><text x="67" y="110" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">1</text><text x="104" y="98" font-family="sans-serif" font-size="19" font-weight="bold" fill="#102d4c">Khách → Zalo Bot Platform</text><text x="104" y="121" font-family="sans-serif" font-size="16" fill="#4d617a">Zalo gửi sự kiện đến địa chỉ webhook của bạn</text><rect x="36" y="160" width="748" height="68" rx="13" fill="white" stroke="#bccde1"/><circle cx="67" cy="194" r="18" fill="#176d69"/><text x="67" y="200" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">2</text><text x="104" y="188" font-family="sans-serif" font-size="19" font-weight="bold" fill="#102d4c">Chương trình bot trên Cloudflare</text><text x="104" y="211" font-family="sans-serif" font-size="16" fill="#4d617a">Kiểm đúng bot, đúng người và tránh trả lời lặp</text><rect x="36" y="250" width="748" height="68" rx="13" fill="white" stroke="#bccde1"/><circle cx="67" cy="284" r="18" fill="#176d69"/><text x="67" y="290" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">3</text><text x="104" y="278" font-family="sans-serif" font-size="19" font-weight="bold" fill="#102d4c">Thông tin đã nạp hoặc OpenAI</text><text x="104" y="301" font-family="sans-serif" font-size="16" fill="#4d617a">Lấy thông tin đã có hoặc nhờ AI trả lời khi được bật</text><rect x="36" y="340" width="748" height="68" rx="13" fill="white" stroke="#bccde1"/><circle cx="67" cy="374" r="18" fill="#176d69"/><text x="67" y="380" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">4</text><text x="104" y="368" font-family="sans-serif" font-size="19" font-weight="bold" fill="#102d4c">Bot gửi trả lời về Zalo</text><text x="104" y="391" font-family="sans-serif" font-size="16" fill="#4d617a">Gửi về đúng chat; laptop lập trình có thể tắt</text><text x="36" y="449" font-family="sans-serif" font-size="14" fill="#4d617a">Sơ đồ minh họa • Không phải ảnh chụp giao diện thật</text></svg>