<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 375" role="img"><title>Bot nhớ cuộc trò chuyện</title><rect width="820" height="375" rx="24" fill="#edf3fa"/><text x="36" y="44" font-family="sans-serif" font-size="23" font-weight="bold" fill="#102d4c">Bot nhớ cuộc trò chuyện</text><rect x="36" y="70" width="748" height="68" rx="13" fill="white" stroke="#bccde1"/><circle cx="67" cy="104" r="18" fill="#176d69"/><text x="67" y="110" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">1</text><text x="104" y="98" font-family="sans-serif" font-size="19" font-weight="bold" fill="#102d4c">Bạn chọn có lưu hay không</text><text x="104" y="121" font-family="sans-serif" font-size="16" fill="#4d617a">Chỉ lưu hội thoại 30 ngày khi bạn đồng ý</text><rect x="36" y="160" width="748" height="68" rx="13" fill="white" stroke="#bccde1"/><circle cx="67" cy="194" r="18" fill="#176d69"/><text x="67" y="200" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">2</text><text x="104" y="188" font-family="sans-serif" font-size="19" font-weight="bold" fill="#102d4c">Bot dùng tin trong cùng chat</text><text x="104" y="211" font-family="sans-serif" font-size="16" fill="#4d617a">Lấy một số tin liên quan để trả lời</text><rect x="36" y="250" width="748" height="68" rx="13" fill="white" stroke="#bccde1"/><circle cx="67" cy="284" r="18" fill="#176d69"/><text x="67" y="290" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">3</text><text x="104" y="278" font-family="sans-serif" font-size="19" font-weight="bold" fill="#102d4c">Bảng sản phẩm và tài liệu</text><text x="104" y="301" font-family="sans-serif" font-size="16" fill="#4d617a">Thêm ở Bài 7 khi bạn cần</text><text x="36" y="359" font-family="sans-serif" font-size="14" fill="#4d617a">Sơ đồ minh họa • Không phải ảnh chụp giao diện thật</text></svg>